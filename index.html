<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Space Waves (standalone)</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#13141E" />
  <!-- Patched CrazyGames SDK (environment forced to 'local'): loading it here
       means the game's SDK loader finds it already present and never pulls the
       CDN version — which would run in "disabled" mode on our own domain. -->
  <script src="crazygames-sdk-v3.js"></script>
  <script>
    // Route any attempt to load the SDK from the CDN to our patched local copy.
    // The game's SDK loader injects https://sdk.crazygames.com/... during boot;
    // on our own domain that version would run in "disabled" mode and freeze
    // the game. This must be defined before any SDK script tag is parsed.
    (function () {
      try {
        var d = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
        Object.defineProperty(HTMLScriptElement.prototype, 'src', {
          get: d.get,
          set: function (v) {
            try {
              if (typeof v === 'string' && v.indexOf('sdk.crazygames.com') !== -1) {
                v = 'crazygames-sdk-v3.js';
              }
            } catch (e) {}
            d.set.call(this, v);
          },
          configurable: true
        });
      } catch (e) {}
    })();
  </script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #13141E; overflow: hidden; }
    #wrap { position: relative; width: 100%; height: 100%; }
    canvas { width: 100%; height: 100%; display: block; outline: none; }
    #loader { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
              color: #F9FAFF; font-family: Arial, Helvetica, sans-serif; font-size: 14px; gap: 18px;
              background: linear-gradient(180deg, #090C15 0%, #16143C 50%, #452A65 100%); z-index: 2; }
    #bar { width: 40%; height: 6px; background: #2a2b3d; border-radius: 3px; overflow: hidden; }
    #fill { width: 0%; height: 100%; background: #6842ff; transition: width .2s; }
    #fsbtn { position: absolute; top: 12px; right: 12px; z-index: 3; padding: 6px 14px; border: none; border-radius: 6px;
             background: #6842ff; color: #fff; font: 700 13px Arial; cursor: pointer; opacity: .85; }
    #fsbtn:hover { opacity: 1; }
    #err { color: #ff8080; white-space: pre-wrap; max-width: 80%; text-align: center; }
    #swbadge { color: #9dffc4; font-size: 13px; min-height: 16px; }
    #reset { color: #7f8296; font-size: 12px; text-decoration: underline; cursor: pointer; }
    /* never show the SDK's local-mode fake ad overlay, whatever happens */
    #local-overlay { display: none !important; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="canvas" tabindex="0"></canvas>
    <button id="fsbtn" title="Fullscreen">Fullscreen</button>
    <div id="loader">
      <div>Space Waves — standalone</div>
      <div id="bar"><div id="fill"></div></div>
      <div id="pct">Downloading… 0%</div>
      <div id="swbadge"></div>
      <div id="err"></div>
      <div id="reset">Stuck? Reset game files &amp; cache</div>
    </div>
  </div>

  <script>
    // ---- Cap render resolution on very dense screens -----------------------
    // The game renders at windowSize x devicePixelRatio. Phones report DPR 3,
    // which can freeze the tab; 2x stays sharp but is far lighter.
    (function () {
      try {
        var real = window.devicePixelRatio || 1;
        var capped = Math.min(real, 2);
        if (capped !== real) {
          Object.defineProperty(window, 'devicePixelRatio', {
            get: function () { return capped; }, configurable: true
          });
        }
      } catch (e) {}
    })();

    // ---- SiteLock bypass ----------------------------------------------------
    // The bundled CrazySDK freezes the game forever (SiteLockFreezeGame /
    // SiteLockFreezeGameCoroutine) when the host is not in its whitelist
    // (crazygames.com, msnfun.com, localhost...). Unity's C# reads
    // Application.absoluteURL from document.URL, so report localhost —
    // an allowed host — and the check passes on our own domain.
    (function () {
      try {
        Object.defineProperty(document, 'URL', {
          get: function () { return 'http://localhost/'; },
          configurable: true
        });
      } catch (e) { console.warn('[sitelock] patch failed', e); }
    })();

    // ---- Minimal CrazyGames SDK stub so the game does not crash outside the gameframe ----
    (function () {
      const noop = function () { return Promise.resolve(); };
      window.Crazygames = window.Crazygames || {
        load: noop,
        sdk: {},
        game: { loadingStart: noop, loadingStop: noop, happytime: noop, sdkGameLoadingStart: noop, sdkGameLoadingStop: noop },
        ad: { requestAd: noop, adFinished: noop, adError: noop, adStarted: noop },
        banner: noop,
        inviteLink: noop,
        user: { getUser: function () { return Promise.reject(new Error('offline')); }, showLoginPrompt: noop },
        data: { clear: noop, set: noop, setItem: noop, getItem: noop, removeItem: noop, getXp: noop, addXp: noop },
        features: { get: function () { return Promise.resolve(null); }, getSafe: function () { return Promise.resolve(null); } }
      };
      // Many SDK builds look for these too
      window.Crazygames.SDK = window.Crazygames.sdk;
    })();

    // ---- Unity loader ----
    var script = document.createElement('script');
    script.src = 'Build/loader.js';
    script.onload = function () {
      createUnityInstance(document.getElementById('canvas'), {
        dataUrl: 'Build/data.unityweb',
        codeUrl: 'Build/wasm.wasm',
        frameworkUrl: 'Build/framework.js',
        streamingAssetsUrl: 'StreamingAssets',
        matchWebGLToCanvasSize: true
      }, function (progress) {
        var p = Math.round(progress * 100);
        document.getElementById('fill').style.width = p + '%';
        // past 90% Unity is compiling/starting, not downloading — say so
        document.getElementById('pct').textContent = p >= 90
          ? 'Starting game… (first boot can take a while on a phone)'
          : 'Downloading… ' + p + '%';
      }).then(function (instance) {
        var l = document.getElementById('loader');
        if (l) l.remove();
        document.getElementById('canvas').focus();
      }).catch(function (e) {
        document.getElementById('pct').textContent = '';
        document.getElementById('err').textContent = 'Failed to start: ' + (e && e.message ? e.message : e);
      });
    };
    document.head.appendChild(script);

    // ---- Offline cache (service worker) ----
    var badge = document.getElementById('swbadge');
    function setBadge(t) { if (badge) badge.textContent = t; }
    function checkOfflineReady() {
      if (!('caches' in window)) return;
      caches.match('Build/wasm.wasm', { ignoreSearch: true }).then(function (hit) {
        if (hit) setBadge('Offline-ready: all files cached');
        else setTimeout(checkOfflineReady, 4000);
      }).catch(function () { setTimeout(checkOfflineReady, 4000); });
    }
    if ('serviceWorker' in navigator) {
      // when a new service worker takes over (e.g. after updating these files),
      // reload once automatically so the user never sees a stale page
      var __reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (__reloaded) return;
        __reloaded = true;
        if (navigator.serviceWorker.controller) location.reload();
      });
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        if (navigator.serviceWorker.controller) checkOfflineReady();
        reg.addEventListener('updatefound', function () {
          var sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', function () {
            if (sw.state === 'activated') checkOfflineReady();
          });
        });
      }).catch(function (e) { console.warn('[SW] registration failed:', e); });
    }

    // ---- Emergency reset: wipe every cached copy and start fresh ----------
    // Recovers from corrupt cached builds without devtools.
    document.getElementById('reset').addEventListener('click', function () {
      setBadge('Resetting caches…');
      try {
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) {
              if (k.indexOf('space-waves') === 0) caches.delete(k);
            });
          });
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
        }
        // wipe Unity's own download cache (IndexedDB "UnityCache_*")
        if (window.indexedDB) {
          if (indexedDB.databases) {
            indexedDB.databases().then(function (dbs) {
              dbs.forEach(function (d) {
                if (d.name && d.name.indexOf('UnityCache') === 0) indexedDB.deleteDatabase(d.name);
              });
            }).catch(function () {
              try { indexedDB.deleteDatabase('UnityCache_Unity_WebGL Player'); } catch (e) {}
            });
          } else {
            try { indexedDB.deleteDatabase('UnityCache_Unity_WebGL Player'); } catch (e) {}
          }
        }
        setTimeout(function () { location.reload(); }, 1200);
      } catch (e) { location.reload(); }
    });

    // ---- Kill the fake "A midgame ad would appear here" popup ----
    // The bundled CrazyGames SDK runs in "local" mode and emulates ads with an
    // overlay. Replace requestAd with an instant finish so no ad UI ever shows.
    // Keeps polling: if the SDK script is re-executed, the new object is
    // patched again too.
    (function () {
      var attempts = 0;
      (function tryPatch() {
        attempts++;
        try {
          var sdk = (window.CrazyGames && window.CrazyGames.SDK) ||
                    (window.Crazygames && window.Crazygames.SDK) || null;
          if (sdk && sdk.ad && typeof sdk.ad.requestAd === 'function' && !sdk.ad.__noAds) {
            sdk.ad.requestAd = function (type, callbacks) {
              callbacks = callbacks || {};
              // fire callbacks on the next tick, like the real SDK would
              setTimeout(function () {
                try { if (callbacks.adStarted) callbacks.adStarted(); } catch (e) {}
                try { if (callbacks.adFinished) callbacks.adFinished(); } catch (e) {}
              }, 0);
              return Promise.resolve();
            };
            sdk.ad.__noAds = true;
            // detach the overlay element so even legacy references can't display it
            try {
              var ov = sdk.ad.overlay;
              if (ov && ov.parentElement) ov.parentElement.removeChild(ov);
            } catch (e) {}
            console.log('[no-ads] ad requests auto-finished');
          }
        } catch (e) {}
        if (attempts < 600) setTimeout(tryPatch, 100); // keep waiting up to ~60s
      })();
    })();

    // ---- Fullscreen (hidden on iPhones, where the API doesn't exist) ------
    (function () {
      var btn = document.getElementById('fsbtn');
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) { btn.style.display = 'none'; return; }
      btn.addEventListener('click', function () {
        try {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            var p = req.call(el);
            if (p && p.then) p.then(function () { document.getElementById('canvas').focus(); }).catch(function () {});
          } else if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        } catch (e) {}
      });
    })();
  </script>
</body>
</html>
